services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.mcp_server
    env_file: .env
    expose: ["8010"]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["80:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  uploads:
