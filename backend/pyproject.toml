[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-english-coach"
version = "0.1.0"
description = "A production-shaped, self-improving Business English coaching agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.18,<1",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "langgraph>=0.3,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "redis>=5,<7",
  "celery[redis]>=5.4,<6",
  "mcp>=1.6,<2",
  "pypdf>=5,<7",
  "prometheus-client>=0.21,<1",
  "structlog>=24,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# FastAPI intentionally declares dependency calls in parameter defaults.
ignore = ["B008"]
